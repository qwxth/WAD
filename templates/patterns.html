<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LoadForecast — Паттерны нагрузки</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="mobile-app">

<div class="phone-frame">
    <header class="lf-header">
        <div class="lf-header__inner"></div>
    </header>
    <details class="lf-filter" id="filterSection"{% if max_expected is not none %} open{% endif %}>
        <summary class="lf-filter__toggle lf-btn-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Фильтр</span>
        </summary>
        <form method="get" action="/load_patterns" class="lf-filter__form" id="filterForm">
            <label class="lf-filter__label" for="max_expected">
                Матожидание до <output class="lf-filter__output" for="max_expected">{{ (max_expected // 1000000) if max_expected else 200 }}</output> млн
            </label>
            <input
                class="lf-filter__slider"
                type="range"
                id="max_expected"
                name="max_expected"
                min="1"
                max="200"
                value="{{ (max_expected // 1000000) if max_expected else 200 }}"
            >
            <button type="submit" class="lf-filter__submit lf-btn-pill">Найти</button>
        </form>
    </details>

    <main class="lf-main">
        <div class="lf-grid">
            {% for pattern in patterns %}
            <article class="lf-card">
                <a href="/load_patterns/{{ pattern.id }}" class="lf-card__img-link">
                    <img class="lf-card__img"
                         src="{{ pattern.image_url or '/static/img/uniform.jpg' }}"
                         alt="{{ pattern.pattern_name }}"
                         onerror="this.onerror = null; this.src='/static/img/uniform.jpg'">
                </a>
                <div class="lf-card__body">
                    <a href="/load_patterns/{{ pattern.id }}" class="lf-card__title">
                        {{ pattern.pattern_name }}
                    </a>
                    <div class="lf-card__meta">
                        <div class="lf-card__meta-item">
                            <span class="lf-card__meta-label">Матожид.:</span>
                            <strong>{{ (pattern.expected_request_count / 1000000) | int }} млн</strong>
                        </div>
                        <div class="lf-card__meta-item">
                            <span class="lf-card__meta-label">Среднее:</span>
                            <strong>{{ pattern.average_request_count }}</strong>
                        </div>
                    </div>
                    <div class="lf-card__footer">
                        <span class="lf-card__likes">❤️ {{ pattern.likes_count }}</span>
                        <form method="post" action="/load_patterns/{{ pattern.id }}/delete" style="display: inline;">
                            <button type="submit" class="lf-card__delete-btn lf-btn-pill"
                                    onclick="return confirm('Удалить паттерн?')">Удалить</button>
                        </form>
                    </div>
                </div>
            </article>
            {% else %}
            <p class="lf-grid__empty">
                Паттерны не найдены.
            </p>
            {% endfor %}
        </div>
    </main>

    <nav class="lf-tabs">
        <a href="/load_patterns/feed" class="lf-tabs__item">
            <span class="lf-tabs__label">Лента</span>
        </a>
        <a href="/load_patterns/draft" class="lf-tabs__item">
            <span class="lf-tabs__label">Заявка</span>
        </a>
        <a href="/load_patterns" class="lf-tabs__item lf-tabs__item--active">
            <span class="lf-tabs__label">Плитка</span>
        </a>
    </nav>
</div>

<script>
// Слайдер ТОЛЬКО обновляет цифру на экране.
// Фильтрация срабатывает исключительно по клику на кнопку "Найти" (submit формы).
const slider = document.getElementById('max_expected');
const output = document.querySelector('.lf-filter__output');

slider.addEventListener('input', function() {
    output.value = this.value;
});
</script>

</body>
</html>
